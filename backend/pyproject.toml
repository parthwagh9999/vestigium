[project]
name = "vestigium"
version = "0.1.0"
description = "Enterprise-grade open-source OSINT investigation platform with visual link-analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "VESTIGIUM Contributors"}
]
keywords = ["osint", "intelligence", "investigation", "graph", "link-analysis", "cybersecurity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    # ---- Web Framework ----
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "websockets>=14.0",

    # ---- Database ----
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",

    # ---- Validation & Serialization ----
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # ---- Authentication & Security ----
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0.0",

    # ---- HTTP Client ----
    "httpx>=0.28.0",

    # ---- Graph Analysis ----
    "networkx>=3.4",

    # ---- Task Queue (in-process fallback included) ----
    "celery>=5.4.0",

    # ---- DNS & Network ----
    "dnspython>=2.7.0",
    "python-whois>=0.9.4",
    "ipwhois>=1.2.0",

    # ---- File Processing ----
    "python-magic>=0.4.27",
    "Pillow>=11.0.0",
    "PyPDF2>=3.0.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.0",

    # ---- Data Formats ----
    "orjson>=3.10.0",
    "pyyaml>=6.0.2",
    "toml>=0.10.2",
    "xmltodict>=0.14.0",

    # ---- Utilities ----
    "python-dateutil>=2.9.0",
    "email-validator>=2.2.0",
    "phonenumbers>=8.13.0",
    "tldextract>=5.1.0",
    "user-agents>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "ssdeep>=3.4; sys_platform != 'win32'",
    "tlsh>=4.5.0; sys_platform != 'win32'",

    # ---- Export ----
    "jinja2>=3.1.4",
    "markdown>=3.7",
    "reportlab>=4.2.0",

    # ---- Scheduling ----
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
]
redis = [
    "redis>=5.2.0",
]
ai = [
    "openai>=1.55.0",
    "tiktoken>=0.8.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "factory-boy>=3.3.1",
]
all = [
    "vestigium[postgres,redis,ai,dev]",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "RUF",  # Ruff-specific
]
ignore = ["S101", "S603", "S607", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
